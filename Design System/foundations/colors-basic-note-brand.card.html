<!-- @dsCard group="Themes" viewport="700x150" name="Basic Note — Brand palette" subtitle="Mellow-white base + de-saturated accents" -->
<!DOCTYPE html>
<html lang="en" data-theme="basic-note"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 18px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-medium); border: 1px solid var(--color-divider); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .meta b { display: block; font-family: var(--font-sans); font-size: 12px; color: var(--color-foreground); font-weight: 600; margin-bottom: 2px; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--bn-bg)"></div><div class="meta"><b>Background</b>#f5efd2</div></div>
  <div class="sw"><div class="chip" style="background:var(--bn-ink)"></div><div class="meta"><b>Ink</b>#211d16</div></div>
  <div class="sw"><div class="chip" style="background:var(--bn-sage)"></div><div class="meta"><b>Sage (primary)</b>#91a66e</div></div>
  <div class="sw"><div class="chip" style="background:var(--bn-oat)"></div><div class="meta"><b>Oat (secondary)</b>#c8b27e</div></div>
  <div class="sw"><div class="chip" style="background:var(--bn-sky)"></div><div class="meta"><b>Sky (tag)</b>#bcc8dc</div></div>
  <div class="sw"><div class="chip" style="background:var(--bn-rose)"></div><div class="meta"><b>Rose (tag)</b>#e1c1d1</div></div>
</div>
</body></html>
